name: Release Verve CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0) - Leave empty to skip release creation"
        required: false
        default: ""

jobs:
  build-cli-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build macOS AMD64 CLI
        run: |
          cd cli
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.Version=${{ github.event.inputs.version || 'dev' }}" -o verve-cli-darwin-amd64 .

      - name: Build macOS ARM64 CLI
        run: |
          cd cli
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.Version=${{ github.event.inputs.version || 'dev' }}" -o verve-cli-darwin-arm64 .

      - name: Package macOS archives
        run: |
          cd cli
          tar czf verve-cli-darwin-amd64.tar.gz verve-cli-darwin-amd64
          tar czf verve-cli-darwin-arm64.tar.gz verve-cli-darwin-arm64
          shasum -a 256 verve-cli-darwin-amd64.tar.gz > verve-cli-darwin-amd64.tar.gz.sha256
          shasum -a 256 verve-cli-darwin-arm64.tar.gz > verve-cli-darwin-arm64.tar.gz.sha256

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-macos
          path: |
            cli/verve-cli-darwin-amd64.tar.gz
            cli/verve-cli-darwin-amd64.tar.gz.sha256
            cli/verve-cli-darwin-arm64.tar.gz
            cli/verve-cli-darwin-arm64.tar.gz.sha256

  build-cli-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install MinGW for Cross-Compilation
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64

      - name: Build Windows CLI
        run: |
          cd cli
          CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=${{ github.event.inputs.version || 'dev' }}" -o verve-cli-windows-amd64.exe .

      - name: Package Windows archive
        run: |
          cd cli
          zip verve-cli-windows-amd64.zip verve-cli-windows-amd64.exe
          sha256sum verve-cli-windows-amd64.zip > verve-cli-windows-amd64.zip.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-windows
          path: |
            cli/verve-cli-windows-amd64.exe
            cli/verve-cli-windows-amd64.zip
            cli/verve-cli-windows-amd64.zip.sha256

  create-release:
    if: github.event.inputs.version != ''
    needs: [build-cli-macos, build-cli-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -la release-artifacts/

      - name: Create Release on public repo
        uses: softprops/action-gh-release@v2
        with:
          repository: gyandeeps/verve-releases
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: release-artifacts/*
          draft: false
          prerelease: false

  update-package-managers:
    if: github.event.inputs.version != ''
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download checksums
        uses: actions/download-artifact@v7
        with:
          path: checksums
          merge-multiple: true

      - name: Extract checksums
        id: checksums
        run: |
          echo "sha256_arm64=$(cat checksums/verve-cli-darwin-arm64.tar.gz.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256_amd64=$(cat checksums/verve-cli-darwin-amd64.tar.gz.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256_win=$(cat checksums/verve-cli-windows-amd64.zip.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update Homebrew Formula
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          repository: gyandeeps/homebrew-tap
          event-type: update-formula
          client-payload: |
            {
              "version": "${{ github.event.inputs.version }}",
              "sha256_arm64": "${{ steps.checksums.outputs.sha256_arm64 }}",
              "sha256_amd64": "${{ steps.checksums.outputs.sha256_amd64 }}"
            }

      - name: Update Scoop Manifest
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          repository: gyandeeps/scoop-verve
          event-type: update-manifest
          client-payload: |
            {
              "version": "${{ github.event.inputs.version }}",
              "sha256_win": "${{ steps.checksums.outputs.sha256_win }}"
            }
